<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-lt-installed="true"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alavancar Carreiras — Indicadores de Faturamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --dark:#002E24;
  --green:#007D59;
  --amber:#F9B112;
  --bg:#FAFBFA;
  --page-bg:#002E24;
  --gray:#575656;
  --white:#FFFFFF;
  --line:#CFD9D4;
  --text:#002E24;
  --warn:#8a6300;
  --radius:14px;
  --track:rgba(0,46,36,.1);
  --shadow:0 2px 8px rgba(0,46,36,.06);
  --shadow-hover:0 4px 14px rgba(0,46,36,.1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;
    --page-bg:#0E1613;
    --white:#16211D;
    --line:#26332E;
    --gray:#A9B3AF;
    --text:#EAF2EE;
    --warn:#F9B112;
    --track:rgba(255,255,255,.14);
    --shadow:0 2px 8px rgba(0,0,0,.35);
    --shadow-hover:0 4px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613;
  --page-bg:#0E1613;
  --white:#16211D;
  --line:#26332E;
  --gray:#A9B3AF;
  --text:#EAF2EE;
  --warn:#F9B112;
  --track:rgba(255,255,255,.14);
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-hover:0 4px 14px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',-apple-system,sans-serif;
  background:var(--page-bg);
  color:var(--text);
  min-height:100vh;
}
::selection{background:var(--amber);color:var(--dark);}
button{font-family:inherit;}
a{color:inherit;}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* header */
.header-band{background:var(--dark);padding:26px 20px;}
.header-inner{
  max-width:1080px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
}
.header-inner h1{
  color:#fff;font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;
}
.header-inner p{margin:0;color:rgba(255,255,255,.68);font-size:14.5px;}
.header-meta{text-align:right;font-size:12.5px;color:rgba(255,255,255,.68);}
.header-meta b{color:#fff;}
.save-bar{
  display:flex;align-items:center;gap:10px;margin-top:10px;justify-content:flex-end;
}
.save-btn{
  background:var(--amber);color:var(--dark);border:none;border-radius:999px;
  padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
.save-btn:hover{background:#fff;}
.save-btn:active{transform:scale(0.97);}
.save-btn[disabled]{background:rgba(255,255,255,.18);color:rgba(255,255,255,.55);}
.save-status{font-size:12.5px;color:rgba(255,255,255,.68);min-width:120px;}
.save-status.ok{color:#fff;font-weight:600;}
.save-status.dirty{color:var(--amber);font-weight:600;}

/* tabs */
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
.tab-btn{
  flex:0 0 auto;
  border:1px solid var(--line);background:var(--white);color:var(--text);
  border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:all .15s ease;
}
.tab-btn:hover{border-color:var(--green);}
.tab-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.tab-btn.active{background:var(--amber);border-color:var(--amber);color:var(--dark);}

/* cards */
.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}

/* overview */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
@media (max-width:640px){.summary-row{grid-template-columns:repeat(2,1fr);}}
.summary-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.summary-card .num{font-size:26px;font-weight:700;line-height:1.1;}
.summary-card .lbl{font-size:12.5px;color:var(--gray);margin-top:4px;}

/* status board (visão geral) */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
@media (max-width:860px){.board{grid-template-columns:1fr;}}
.board-col{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);
}
.board-col-head{
  display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);
}
.board-col-atencao .board-col-head{color:var(--warn);}
.board-col-avancando .board-col-head{color:var(--green);}
.board-col-atingido .board-col-head{color:var(--text);}
.board-count{
  background:var(--bg);color:var(--gray);font-size:11px;font-weight:700;
  padding:2px 9px;border-radius:999px;
}
.board-empty{font-size:12.5px;color:var(--gray);font-style:italic;padding:6px 0;}
.mini-card{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
  margin-bottom:10px;cursor:pointer;transition:border-color .15s ease;
}
.mini-card:last-child{margin-bottom:0;}
.mini-card:hover{border-color:var(--green);}
.mini-card:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.mini-card-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:2px;}
.mini-card .analista{font-size:11.5px;color:var(--gray);margin-bottom:8px;}
.mini-card-bottom{
  display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
  color:var(--gray);flex-wrap:wrap;gap:6px;margin-top:8px;
}
.trend{font-weight:700;font-size:11px;margin-left:4px;}
.trend.up{color:var(--green);}
.trend.down{color:var(--warn);}
.trend.flat{color:var(--gray);font-weight:500;}
.mini-track{position:relative;height:6px;background:var(--track);border-radius:6px;overflow:visible;}
.mini-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--green);}
.mini-fill.done{background:var(--amber);}
.pct-tag{font-weight:700;font-size:13px;}
.badge{
  display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--gray);
}
.badge.fixo{border-color:var(--amber);color:var(--warn);}
.badge.ecx{border-color:var(--green);color:var(--green);}
.badge.done{border-color:var(--green);background:var(--green);color:#fff;}

/* unit detail */
.unit-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:26px;}
.unit-head h2{margin:0 0 2px;font-size:24px;font-weight:700;}
.unit-head .sub{color:var(--gray);font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.name-input{
  border:1px solid transparent;background:transparent;font-family:inherit;
  font-size:13.5px;color:var(--gray);padding:2px 4px;border-radius:6px;width:140px;
}
.name-input:hover,.name-input:focus{border-color:var(--line);background:var(--bg);}

.marco-count{
  background:var(--dark);color:#fff;border-radius:999px;padding:8px 16px;
  font-size:13px;font-weight:600;text-align:center;
}
.marco-count b{font-size:17px;}

.progress-block{margin:26px 0 8px;}
.progress-labels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gray);margin-bottom:10px;}
.progress-labels b{color:var(--text);font-size:13.5px;}
.track{position:relative;height:10px;background:var(--track);border-radius:10px;margin:34px 0 10px;}
.track-fill{position:absolute;left:0;top:0;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--dark),var(--green));transition:width .3s ease;}
.track-marker{
  position:absolute;top:50%;width:18px;height:18px;border-radius:50%;
  background:var(--amber);border:3px solid var(--white);box-shadow:0 1px 4px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);transition:left .3s ease;
}
.track-marker-tag{
  position:absolute;bottom:20px;transform:translateX(-50%);
  background:var(--dark);color:#fff;font-size:12px;font-weight:600;
  padding:4px 9px;border-radius:7px;white-space:nowrap;
}
.track-marker-tag::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--dark);
}
.gap-line{display:flex;justify-content:space-between;align-items:center;margin:22px 0;padding:16px 18px;background:var(--bg);border-radius:12px;flex-wrap:wrap;gap:10px;}
.gap-line .txt{font-size:14.5px;}
.gap-line .val{font-size:22px;font-weight:700;color:var(--green);}
.gap-line.reached{background:var(--green);}
.gap-line.reached .txt,.gap-line.reached .val{color:#fff;}

.month-section{margin-top:28px;}
.month-section h4{font-size:13px;color:var(--gray);font-weight:600;margin:0 0 18px;}
.area-chart-wrap{position:relative;width:100%;margin-bottom:8px;}
.area-chart-wrap svg{display:block;width:100%;overflow:visible;}
.area-label-row{display:flex;justify-content:space-between;padding:0 4px;margin-top:6px;}
.area-label-row span{font-size:11px;color:var(--gray);text-align:center;flex:1;}
.area-label-row span.area-label-current{color:var(--amber);font-weight:700;}
.month-add{margin-top:20px;}

.field-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--gray);font-weight:500;}
.field input[type="number"],.field select{
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14.5px;
  font-family:inherit;background:var(--white);color:var(--text);min-width:170px;
}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px;}
.ghost-btn{
  border:1px solid var(--text);background:transparent;color:var(--text);
  border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.ghost-btn:hover{background:var(--dark);color:#fff;}

.marco-form{
  margin-top:16px;padding:16px;border:1px dashed var(--green);border-radius:12px;
  display:none;gap:12px;align-items:flex-end;flex-wrap:wrap;
}
.marco-form.open{display:flex;}
.primary-btn{
  border:none;background:var(--green);color:#fff;border-radius:9px;padding:10px 18px;
  font-size:13.5px;font-weight:600;cursor:pointer;
}
.primary-btn:hover{background:var(--dark);}
.link-btn{border:none;background:transparent;color:var(--gray);font-size:13px;cursor:pointer;text-decoration:underline;padding:6px;}

.history{margin-top:30px;}
.history h4{font-size:13px;text-transform:none;color:var(--gray);font-weight:600;margin:0 0 10px;}
.history ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.history li{font-size:13px;color:var(--gray);display:flex;gap:8px;}
.history li b{color:var(--text);}
.empty-hist{font-size:13px;color:var(--gray);font-style:italic;}

.info-note{
  margin-top:26px;font-size:12.5px;color:var(--gray);line-height:1.6;
  border-top:1px solid var(--line);padding-top:16px;
}
.info-note b{color:var(--text);}
</style>
</head>

<script id="app-script">

(function(){
  var STATE = JSON.parse(document.getElementById('state-data').textContent);
  var currentTab = 'overview';
  var dirty = false;
  var openMarcoForm = null;
  var artifactApi = null;
  var canPublish = false;

  function fmtBRL(v){
    if(v === null || v === undefined) return '—';
    return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pctFor(u){
    var base = u.ultimoMarco || 0;
    var top = u.proximoMarco;
    if(top <= base) return 1;
    var p = (u.faturamentoAtual - base) / (top - base);
    if(p < 0) p = 0;
    if(p > 1) p = 1;
    return p;
  }
  function isDone(u){ return u.faturamentoAtual >= u.proximoMarco; }
  function todayBR(){
    var d = new Date();
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
  }
  var MONTH_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function currentMonthKey(){
    var d = new Date();
    var m = d.getMonth()+1;
    return d.getFullYear() + '-' + (m<10?'0'+m:m);
  }
  function monthLabel(key){
    var parts = key.split('-');
    var mi = parseInt(parts[1],10)-1;
    return MONTH_ABBR[mi] + '/' + parts[0].slice(2);
  }
  function upsertHistoryAt(u, key, valor){
    if(!u.historicoFaturamento) u.historicoFaturamento = [];
    var found = null;
    for(var i=0;i<u.historicoFaturamento.length;i++){
      if(u.historicoFaturamento[i].mes === key){ found = u.historicoFaturamento[i]; break; }
    }
    if(found){
      found.valor = valor;
    } else {
      u.historicoFaturamento.push({mes:key, valor:valor});
      u.historicoFaturamento.sort(function(a,b){ return a.mes < b.mes ? -1 : (a.mes > b.mes ? 1 : 0); });
    }
  }
  function upsertMonthlyHistory(u){
    upsertHistoryAt(u, currentMonthKey(), u.faturamentoAtual);
  }
  function trendFor(u){
    var h = u.historicoFaturamento || [];
    if(h.length < 2) return null;
    return h[h.length-1].valor - h[h.length-2].valor;
  }

  function setDirty(v){
    dirty = v;
    var btn = document.getElementById('save-btn');
    var status = document.getElementById('save-status');
    if(!btn || !status) return;
    if(v){
      btn.removeAttribute('disabled');
      status.textContent = 'Alterações não salvas';
      status.className = 'save-status dirty';
    } else {
      btn.setAttribute('disabled','disabled');
    }
  }

  function render(){
    var app = document.getElementById('app');
    app.innerHTML = renderTop() + '<div class="wrap">' + renderTabs() + (currentTab === 'overview' ? renderOverview() : renderUnit(findUnit(currentTab))) + '</div>';
    attachHandlers();
  }

  function findUnit(id){
    for(var i=0;i<STATE.units.length;i++) if(STATE.units[i].id === id) return STATE.units[i];
    return STATE.units[0];
  }

  function renderTop(){
    return '' +
    '<div class="header-band"><div class="header-inner">' +
      '<div>' +
        '<h1>Programa Alavancar Carreiras</h1>' +
        '<p>Indicadores de faturamento por unidade — acompanhamento mensal</p>' +
      '</div>' +
      '<div class="header-meta">' +
        'Última atualização<br><b>' + esc(STATE.updatedAt) + '</b>' +
        '<div class="save-bar">' +
          '<span id="save-status" class="save-status ' + (dirty?'dirty':'ok') + '">' + (dirty?'Alterações não salvas':'Tudo salvo') + '</span>' +
          '<button id="save-btn" class="save-btn"' + (dirty?'':' disabled') + '>Salvar alterações</button>' +
        '</div>' +
      '</div>' +
    '</div></div>';
  }

  function renderTabs(){
    var html = '<div class="tabs" role="tablist">';
    html += '<button class="tab-btn ' + (currentTab==='overview'?'active':'') + '" data-tab="overview" role="tab">Visão geral</button>';
    STATE.units.forEach(function(u){
      html += '<button class="tab-btn ' + (currentTab===u.id?'active':'') + '" data-tab="' + u.id + '" role="tab">' + esc(u.nome) + '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderOverview(){
    var total = STATE.units.length;
    var doneCount = STATE.units.filter(isDone).length;
    var totalMarcos = STATE.units.reduce(function(a,u){return a+u.marcos;},0);
    var fixoCount = STATE.units.filter(function(u){return u.incentivo==='fixo';}).length;

    var html = '<div class="summary-row">' +
      '<div class="summary-card"><div class="num">' + total + '</div><div class="lbl">Unidades acompanhadas</div></div>' +
      '<div class="summary-card"><div class="num">' + doneCount + '</div><div class="lbl">Marco do mês já atingido</div></div>' +
      '<div class="summary-card"><div class="num">' + totalMarcos + '</div><div class="lbl">Marcos acumulados (total)</div></div>' +
      '<div class="summary-card"><div class="num">' + fixoCount + '</div><div class="lbl">Próximo incentivo é aumento de fixo</div></div>' +
    '</div>';

    var buckets = {
      atencao:{label:'Precisa de atenção', icon:'', units:[]},
      avancando:{label:'Avançando', icon:'', units:[]},
      atingido:{label:'Marco atingido', icon:'✓ ', units:[]}
    };
    STATE.units.forEach(function(u){
      var pct = pctFor(u);
      if(isDone(u)) buckets.atingido.units.push(u);
      else if(pct >= 0.5) buckets.avancando.units.push(u);
      else buckets.atencao.units.push(u);
    });
    ['atencao','avancando','atingido'].forEach(function(k){
      buckets[k].units.sort(function(a,b){return pctFor(b)-pctFor(a);});
    });

    html += '<div class="board">';
    ['atencao','avancando','atingido'].forEach(function(k){
      var b = buckets[k];
      html += '<div class="board-col board-col-' + k + '">' +
        '<div class="board-col-head"><span>' + b.icon + b.label + '</span><span class="board-count">' + b.units.length + '</span></div>';
      if(b.units.length === 0){
        html += '<div class="board-empty">Nenhuma unidade aqui agora</div>';
      } else {
        b.units.forEach(function(u){
          var pct = pctFor(u);
          var done = isDone(u);
          var trend = trendFor(u);
          var trendHtml = '';
          if(trend !== null){
            if(trend > 0) trendHtml = '<span class="trend up">▲ ' + fmtBRL(trend) + '</span>';
            else if(trend < 0) trendHtml = '<span class="trend down">▼ ' + fmtBRL(Math.abs(trend)) + '</span>';
            else trendHtml = '<span class="trend flat">— estável</span>';
          }
          html += '<div class="mini-card" data-open="' + u.id + '" tabindex="0">' +
            '<div class="mini-card-top"><b>' + esc(u.nome) + '</b><span class="pct-tag" style="color:' + (done?'var(--green)':'var(--text)') + '">' + Math.round(pct*100) + '%</span></div>' +
            '<div class="analista">' + esc(u.analista) + '</div>' +
            '<div class="mini-track"><div class="mini-fill ' + (done?'done':'') + '" style="width:' + (pct*100) + '%"></div></div>' +
            '<div class="mini-card-bottom">' +
              '<span>' + fmtBRL(u.faturamentoAtual) + trendHtml + '</span>' +
              '<span class="badge ' + (done?'done':u.incentivo) + '">' + (done?'Atingido':(u.incentivo==='fixo'?'Fixo':'ECX')) + '</span>' +
            '</div>' +
          '</div>';
        });
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderUnit(u){
    var pct = pctFor(u);
    var done = isDone(u);
    var falta = Math.max(0, u.proximoMarco - u.faturamentoAtual);

    var html = '<div class="card">';
    html += '<div class="unit-head">' +
      '<div><h2>' + esc(u.nome) + '</h2>' +
      '<div class="sub">Responsável: <input class="name-input" data-field="analista" value="' + esc(u.analista) + '"></div></div>' +
      '<div class="marco-count">' + u.marcos + 'º marco<br><b>atingido</b></div>' +
    '</div>';

    html += '<div class="progress-block">' +
      '<div class="progress-labels"><span>Último marco<br><b>' + fmtBRL(u.ultimoMarco) + '</b></span>' +
      '<span style="text-align:right">Próximo marco<br><b>' + fmtBRL(u.proximoMarco) + '</b></span></div>' +
      '<div class="track">' +
        '<div class="track-fill" style="width:' + (pct*100) + '%"></div>' +
        '<div class="track-marker" style="left:' + (pct*100) + '%">' +
          '<div class="track-marker-tag">' + fmtBRL(u.faturamentoAtual) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="gap-line ' + (done?'reached':'') + '">' +
      '<span class="txt">' + (done ? 'Marco atingido neste mês' : 'Falta para o próximo marco') + '</span>' +
      '<span class="val">' + (done ? '🎉 ' + fmtBRL(u.faturamentoAtual - u.proximoMarco) + ' acima' : fmtBRL(falta)) + '</span>' +
    '</div>';

    html += renderMonthChart(u);

    html += '<div class="field-row">' +
      '<div class="field"><label>Faturamento atual do mês (R$)</label>' +
      '<input type="number" min="0" step="1000" data-field="faturamentoAtual" value="' + u.faturamentoAtual + '"></div>' +
      '<div class="field"><label>Incentivo ao atingir</label>' +
      '<select data-field="incentivo">' +
        '<option value="ecx" ' + (u.incentivo==='ecx'?'selected':'') + '>Aumento no ECX</option>' +
        '<option value="fixo" ' + (u.incentivo==='fixo'?'selected':'') + '>Aumento no Fixo</option>' +
      '</select></div>' +
      '<button class="ghost-btn" data-action="open-marco">Marco atingido — avançar</button>' +
    '</div>';

    html += '<div class="marco-form ' + (openMarcoForm===u.id?'open':'') + '" id="marco-form">' +
      '<div class="field"><label>Valor do novo próximo marco (R$)</label>' +
      '<input type="number" min="0" step="1000" id="novo-marco-input" placeholder="Ex: ' + (u.proximoMarco + 40000) + '"></div>' +
      '<button class="primary-btn" data-action="confirm-marco">Confirmar avanço</button>' +
      '<button class="link-btn" data-action="cancel-marco">Cancelar</button>' +
    '</div>';

    html += '<div class="history"><h4>Histórico de marcos</h4>';
    if(u.historico.length === 0){
      html += '<div class="empty-hist">Nenhum marco registrado por aqui ainda — os próximos avanços aparecem nesta lista.</div>';
    } else {
      html += '<ul>';
      u.historico.slice().reverse().forEach(function(h){
        html += '<li><b>' + esc(h.data) + '</b> — marco de ' + fmtBRL(h.valor) + ' atingido</li>';
      });
      html += '</ul>';
    }
    html += '</div>';

    html += '<div class="info-note"><b>Como funciona:</b> ao bater o indicador de faturamento da unidade, a colaboradora recebe R$ 1.000 no ECX saldo livre e R$ 300/mês recorrente em alimentação ou mobilidade. Em casos avaliados pela diretoria, o marco pode estar atrelado a um aumento no fixo em vez do benefício via ECX — isso é exceção, não regra.</div>';

    html += '</div>';
    return html;
  }

  function renderMonthChart(u){
    var hist = (u.historicoFaturamento || []).slice(-6);
    var html = '<div class="month-section"><h4>Avanço mês a mês</h4>';
    if(hist.length === 0){
      html += '<div class="empty-hist">Ainda sem histórico — lance os meses abaixo para ver a evolução aqui.</div>';
    } else {
      // Gráfico de área SVG com eixo Y truncado
      var W = 560, H = 160, padL = 8, padR = 8, padT = 36, padB = 2;
      var n = hist.length;

      // Calcular min/max com truncamento (base = 90% do menor valor)
      var minVal = hist[0].valor, maxVal = hist[0].valor;
      hist.forEach(function(h){ if(h.valor < minVal) minVal = h.valor; if(h.valor > maxVal) maxVal = h.valor; });
      var target = u.proximoMarco || maxVal;
      if(target > maxVal) maxVal = target;
      var baseVal = Math.floor(minVal * 0.97 / 1000) * 1000;
      if(baseVal < 0) baseVal = 0;
      var span = maxVal - baseVal || 1;

      function xPos(i){ return padL + i * (W - padL - padR) / Math.max(n - 1, 1); }
      function yPos(v){ return padT + (H - padT - padB) * (1 - (v - baseVal) / span); }

      // Pontos
      var pts = hist.map(function(h,i){ return [xPos(i), yPos(h.valor)]; });

      // Linha suavizada (cardinal spline simplificado)
      function pathD(pts){
        if(pts.length === 1) return 'M'+pts[0][0]+','+pts[0][1];
        var d = 'M'+pts[0][0]+','+pts[0][1];
        for(var i=0;i<pts.length-1;i++){
          var x1=pts[i][0], y1=pts[i][1], x2=pts[i+1][0], y2=pts[i+1][1];
          var cx = (x1+x2)/2;
          d += ' C'+cx+','+y1+' '+cx+','+y2+' '+x2+','+y2;
        }
        return d;
      }

      var linePath = pathD(pts);
      var bottomY = padT + H - padT - padB;
      var areaPath = linePath + ' L'+pts[pts.length-1][0]+','+bottomY+' L'+pts[0][0]+','+bottomY+' Z';

      // Linha de meta
      var targetY = yPos(target);
      var targetInRange = targetY >= padT && targetY <= bottomY;

      var svgId = 'ac-' + currentTab;
      html += '<div class="area-chart-wrap">';
      html += '<svg viewBox="0 0 '+W+' '+H+'" id="'+svgId+'" preserveAspectRatio="none">';

      // Defs gradient
      html += '<defs>'
        +'<linearGradient id="ag-'+svgId+'" x1="0" y1="0" x2="0" y2="1">'
        +'<stop offset="0%" stop-color="var(--green)" stop-opacity="0.35"/>'
        +'<stop offset="100%" stop-color="var(--green)" stop-opacity="0.03"/>'
        +'</linearGradient>'
        +'</defs>';

      // Grid line base
      html += '<line x1="'+padL+'" y1="'+bottomY+'" x2="'+(W-padR)+'" y2="'+bottomY+'" stroke="var(--line)" stroke-width="1"/>';

      // Meta dashed line
      if(targetInRange){
        html += '<line x1="'+padL+'" y1="'+targetY+'" x2="'+(W-padR)+'" y2="'+targetY+'" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5,4"/>';
        html += '<text x="'+(padL+3)+'" y="'+(targetY-5)+'" font-size="10" fill="var(--warn)" font-family="Poppins,sans-serif" font-weight="600">Meta '+fmtBRL(target)+'</text>';
      }

      // Área preenchida
      html += '<path d="'+areaPath+'" fill="url(#ag-'+svgId+')" />';

      // Linha
      html += '<path d="'+linePath+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';

      // Pontos + valores
      hist.forEach(function(h,i){
        var cx = pts[i][0], cy = pts[i][1];
        var isLast = i === hist.length - 1;
        var dotColor = isLast ? 'var(--amber)' : 'var(--green)';
        var dotStroke = isLast ? '#c98b00' : 'var(--dark)';
        html += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(isLast?5:4)+'" fill="'+dotColor+'" stroke="'+dotStroke+'" stroke-width="1.5"/>';
        // Valor acima do ponto
        var labelY = cy - 9;
        if(labelY < 12) labelY = cy + 18;
        var anchor = 'middle';
        if(i === 0) anchor = 'start';
        if(i === n-1) anchor = 'end';
        html += '<text x="'+cx+'" y="'+labelY+'" font-size="10" fill="'+(isLast?'var(--warn)':'var(--gray)')+'" text-anchor="'+anchor+'" font-family="Poppins,sans-serif" font-weight="'+(isLast?'700':'500')+'">'+fmtBRL(h.valor)+'</text>';
      });

      html += '</svg>';
      // Labels dos meses abaixo
      html += '<div class="area-label-row">';
      hist.forEach(function(h,i){
        var isLast = i === hist.length - 1;
        html += '<span class="'+(isLast?'area-label-current':'')+'">'+monthLabel(h.mes)+'</span>';
      });
      html += '</div>';
      html += '</div>';
    }
    html += '<div class="field-row month-add">' +
      '<div class="field"><label>Lançar / corrigir mês</label><input type="month" id="hist-month-input" value="' + currentMonthKey() + '"></div>' +
      '<div class="field"><label>Faturamento (R$)</label><input type="number" min="0" step="1000" id="hist-value-input" placeholder="0"></div>' +
      '<button class="ghost-btn" data-action="add-hist-month">Lançar mês</button>' +
    '</div>';
    html += '</div>';
    return html;
  }

  function attachHandlers(){
    document.querySelectorAll('[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentTab = btn.getAttribute('data-tab');
        openMarcoForm = null;
        render();
      });
    });
    document.querySelectorAll('[data-open]').forEach(function(card){
      card.addEventListener('click', function(){ currentTab = card.getAttribute('data-open'); render(); });
      card.addEventListener('keypress', function(e){ if(e.key==='Enter'){ currentTab = card.getAttribute('data-open'); render(); } });
    });

    var faturamentoInput = document.querySelector('[data-field="faturamentoAtual"]');
    if(faturamentoInput){
      faturamentoInput.addEventListener('change', function(){
        var u = findUnit(currentTab);
        u.faturamentoAtual = Math.max(0, parseInt(this.value,10) || 0);
        upsertMonthlyHistory(u);
        setDirty(true);
        render();
      });
    }
    var analistaInput = document.querySelector('[data-field="analista"]');
    if(analistaInput){
      analistaInput.addEventListener('change', function(){
        var u = findUnit(currentTab);
        u.analista = this.value.trim() || u.analista;
        setDirty(true);
        render();
      });
    }
    var incentivoSelect = document.querySelector('[data-field="incentivo"]');
    if(incentivoSelect){
      incentivoSelect.addEventListener('change', function(){
        var u = findUnit(currentTab);
        u.incentivo = this.value;
        setDirty(true);
        render();
      });
    }
    var openBtn = document.querySelector('[data-action="open-marco"]');
    if(openBtn){
      openBtn.addEventListener('click', function(){
        openMarcoForm = currentTab;
        render();
        var inp = document.getElementById('novo-marco-input');
        if(inp) inp.focus();
      });
    }
    var cancelBtn = document.querySelector('[data-action="cancel-marco"]');
    if(cancelBtn){
      cancelBtn.addEventListener('click', function(){ openMarcoForm = null; render(); });
    }
    var confirmBtn = document.querySelector('[data-action="confirm-marco"]');
    if(confirmBtn){
      confirmBtn.addEventListener('click', function(){
        var u = findUnit(currentTab);
        var inp = document.getElementById('novo-marco-input');
        var novo = parseInt(inp.value,10);
        if(!novo || novo <= u.proximoMarco){
          inp.style.borderColor = '#c0392b';
          return;
        }
        u.historico.push({data: todayBR(), valor: u.proximoMarco});
        u.ultimoMarco = u.proximoMarco;
        u.proximoMarco = novo;
        u.marcos += 1;
        openMarcoForm = null;
        setDirty(true);
        render();
      });
    }

    var saveBtn = document.getElementById('save-btn');
    if(saveBtn){
      saveBtn.addEventListener('click', saveState);
    }

    var addHistBtn = document.querySelector('[data-action="add-hist-month"]');
    if(addHistBtn){
      addHistBtn.addEventListener('click', function(){
        var u = findUnit(currentTab);
        var monthInput = document.getElementById('hist-month-input');
        var valueInput = document.getElementById('hist-value-input');
        var key = monthInput.value;
        if(!key){
          monthInput.style.borderColor = '#c0392b';
          return;
        }
        var valor = Math.max(0, parseInt(valueInput.value,10) || 0);
        upsertHistoryAt(u, key, valor);
        if(key === currentMonthKey()){ u.faturamentoAtual = valor; }
        setDirty(true);
        render();
      });
    }
  }

  function buildFullHtml(state){
    var docHead = document.documentElement.outerHTML.split('<div id="app">')[0];
    var appScriptSrc = document.getElementById('app-script').textContent;
    var stateJson = JSON.stringify(state, null, 2);
    return '<!DOCTYPE html>\n' + docHead +
      '<div id="app"></div>\n' +
      '<script id="state-data" type="application/json">\n' + stateJson + '\n<\/script>\n' +
      '<script id="app-script">\n' + appScriptSrc + '\n<\/script>\n' +
      '</body>\n</html>';
  }

  function saveState(){
    var now = new Date();
    STATE.updatedAt = now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
    var status = document.getElementById('save-status');

    if(canPublish && artifactApi){
      status.textContent = 'Salvando…';
      status.className = 'save-status dirty';
      var html = buildFullHtml(STATE);
      artifactApi.publish(html).then(function(){
        setDirty(false);
        status.textContent = 'Salvo';
        status.className = 'save-status ok';
        render();
      }).catch(function(){
        status.textContent = 'Falha ao salvar — tente de novo';
        status.className = 'save-status dirty';
      });
    } else {
      try{ localStorage.setItem('alavancar-indicadores-backup', JSON.stringify(STATE)); }catch(e0){}
      try{
        var html2 = buildFullHtml(STATE);
        var blob = new Blob([html2], {type:'text/html'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'alavancar-indicadores.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        var metaB = document.querySelector('.header-meta b');
        if(metaB) metaB.textContent = STATE.updatedAt;
        setDirty(false);
        status.textContent = 'Arquivo atualizado baixado ✓';
        status.className = 'save-status ok';
      }catch(e){
        setDirty(false);
        status.textContent = 'Salvo neste navegador';
        status.className = 'save-status ok';
        render();
      }
    }
  }

  (function init(){
    try{
      var backup = localStorage.getItem('alavancar-indicadores-backup');
      if(backup){
        var parsed = JSON.parse(backup);
        if(parsed && parsed.units) STATE = parsed;
      }
    }catch(e0){}
    render();
    if(window.claude && window.claude.use){
      window.claude.use('artifact').then(function(api){
        if(api){ artifactApi = api; canPublish = true; }
      }).catch(function(){});
    }
  })();
})();

</script>
